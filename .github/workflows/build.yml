name: Build NewGRF
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install nml
      - run: python tools/generate_sprites.py
      - run: sh build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: maglev-high-capacity-grf
          path: maglev_high_capacity_v0.1.0.grf

      - uses: actions/upload-artifact@v4
        with:
          name: goods-opengfx-reference-sprites
          path: graphics/goods_opengfx_reference.png
